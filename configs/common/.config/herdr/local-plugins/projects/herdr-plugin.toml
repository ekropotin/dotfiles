id = "ekropotin.projects"
name = "Projects"
version = "0.1.0"
min_herdr_version = "0.8.2"
description = "Create a ~/Projects/<slug> workspace and start /new-project"
platforms = ["macos", "linux"]

[[actions]]
id = "new"
title = "New Project"
contexts = ["workspace", "pane"]
command = ["herdr", "plugin", "pane", "open", "--plugin", "ekropotin.projects", "--entrypoint", "prompt", "--placement", "overlay", "--focus"]

[[panes]]
id = "prompt"
title = "New Project"
placement = "overlay"
command = ["bash", "new.sh"]
