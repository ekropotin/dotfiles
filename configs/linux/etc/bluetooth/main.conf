# BlueZ daemon configuration.
#
# Only keys we deliberately diverge from defaults are listed; everything
# else falls back to bluez's compiled-in defaults.
#
# Why these overrides exist: BLE peripherals (Logitech LIFT mouse) would
# periodically fail to auto-reconnect after going idle. Two root causes —
# this file addresses the bluez side; the kernel side is handled by
# /etc/udev/rules.d/50-bluetooth-no-autosuspend.rules (USB autosuspend on
# the BT controller was missing brief advertisement windows).

[General]
# Enables AdvertisementMonitor offload so the controller wakes the host
# when a paired peripheral advertises, instead of relying on host-driven
# background scans that easily miss short BLE ad windows.
Experimental = true

# Faster BR/EDR page scan; helps classic peripherals reconnect quickly.
FastConnectable = true

[Policy]
# Re-enable trusted devices automatically after a host reboot/resume.
AutoEnable = true

# Aggressive reconnect schedule for transiently-lost links. Defaults are
# more conservative; this matches the BLE peripheral wake pattern better.
ReconnectAttempts = 7
ReconnectIntervals = 1,2,4,8,16,32,64
