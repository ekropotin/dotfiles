# keyd: macOS Cmd-style modifier on Linux.
#
# Super (meta) becomes a layer trigger. The cmd layer rewrites a small set
# of letters to their Ctrl+letter equivalents so muscle memory from macOS
# (Cmd+C, Cmd+V, Cmd+A, Cmd+X, Cmd+Z, Cmd+W) works across Linux apps.
#
# Super alone never produces output, so Hyprland still sees Super+Return,
# Super+Space, Super+Tab, Super+Q, Super+3/4 etc. as plain Super combos
# for any key NOT listed in the [cmd] layer below.
#
# `:M` makes the layer modifier-preserving: Shift/Alt held alongside Super
# pass through, so Super+Shift+Z -> Ctrl+Shift+Z (redo) and Alt+Super+C ->
# Alt+Ctrl+C (cliphist picker via Hyprland).

[ids]
*

[main]
meta = layer(cmd)

[cmd:M]
c = C-c
v = C-v
x = C-x
a = C-a
z = C-z
w = C-w
